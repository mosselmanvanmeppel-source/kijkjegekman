
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Stream Center</title>

<style>
:root {
    --bg:#080808;
    --panel:#121212;
    --border:#252525;
    --red:#e10600;
    --text:#fff;
    --muted:#999;
    --green:#20cf87;
}

* { box-sizing:border-box; }

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

header {
    height:72px;
    padding:0 35px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#101010;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:20;
}

.logo {
    font-size:22px;
    font-weight:800;
}

.logo span { color:var(--red); }

.status {
    color:var(--muted);
    font-size:13px;
}

main {
    max-width:1450px;
    width:calc(100% - 50px);
    margin:auto;
    padding:40px 0 70px;
}

.hero {
    padding:45px;
    border:1px solid var(--border);
    border-radius:20px;
    background:linear-gradient(110deg,#270b0b,#111 65%);
    margin-bottom:45px;
}

.hero small {
    color:#ff514b;
    font-weight:800;
    letter-spacing:2px;
}

.hero h1 {
    font-size:clamp(42px,7vw,75px);
    margin:12px 0;
    letter-spacing:-3px;
}

.hero p { color:var(--muted); }

.section { margin-bottom:45px; }

.section-head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.section-head h2 {
    font-size:25px;
    margin:0;
}

.section-head h2::before {
    content:"";
    display:inline-block;
    width:4px;
    height:23px;
    background:var(--red);
    margin-right:12px;
    vertical-align:middle;
    border-radius:5px;
}

.count {
    color:var(--muted);
    font-size:13px;
}

.grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.card {
    height:310px;
    position:relative;
    overflow:hidden;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    cursor:pointer;
    transition:.2s;
}

.card:hover {
    transform:translateY(-4px);
    border-color:var(--red);
}

.poster {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.65;
}

.fade {
    position:absolute;
    inset:0;
    background:linear-gradient(transparent 15%,rgba(0,0,0,.95));
}

.badges {
    position:absolute;
    top:14px;
    left:14px;
    display:flex;
    gap:7px;
}

.badge {
    padding:6px 9px;
    border-radius:5px;
    font-size:10px;
    font-weight:800;
}

.live { background:var(--red); }
.upcoming { background:#333; }
.no-embed { background:#555; }

.content {
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:19px;
}

.content h3 {
    margin:0 0 8px;
    font-size:20px;
}

.content p {
    margin:0;
    color:#aaa;
    font-size:13px;
}

.time {
    margin-top:12px;
    font-size:13px;
    color:#ddd;
}

.watch {
    width:100%;
    padding:11px;
    margin-top:15px;
    border:0;
    border-radius:7px;
    background:white;
    color:#111;
    font-weight:800;
    cursor:pointer;
}

.watch:hover {
    background:var(--red);
    color:white;
}

.message {
    grid-column:1/-1;
    padding:35px;
    text-align:center;
    color:var(--muted);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
}

.message strong {
    display:block;
    color:white;
    margin-bottom:8px;
}

/* PLAYER */

.player {
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:black;
    flex-direction:column;
}

.player.open { display:flex; }

.player-header {
    height:65px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#111;
    border-bottom:1px solid #292929;
}

.player-title { font-weight:800; }

.close {
    border:0;
    padding:10px 16px;
    border-radius:7px;
    background:#292929;
    color:white;
    cursor:pointer;
}

.close:hover { background:var(--red); }

.player-content {
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.player-content iframe {
    display:block;
    width:100%;
    height:100%;
    border:0;
}

.player-message {
    max-width:500px;
    padding:30px;
    text-align:center;
}

.player-message p {
    color:var(--muted);
    line-height:1.6;
}

footer {
    padding:25px;
    text-align:center;
    border-top:1px solid var(--border);
    color:#666;
    font-size:12px;
}

@media(max-width:650px) {
    header { padding:0 17px; }
    main { width:calc(100% - 28px); }
    .hero { padding:28px; }
    .grid { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header>
    <div class="logo"><span>F1</span> Stream Center</div>
    <div class="status" id="status">● Verbinden...</div>
</header>

<main>

<section class="hero">
    <small>FORMULA 1</small>
    <h1>Live Racing</h1>
    <p>Alle beschikbare Formula 1 streams op één plek.</p>
    <p id="stats">Streams ophalen...</p>
</section>

<section class="section">
    <div class="section-head">
        <h2>Live</h2>
        <span class="count" id="liveCount">0 streams</span>
    </div>
    <div class="grid" id="liveGrid"></div>
</section>

<section class="section">
    <div class="section-head">
        <h2>Upcoming</h2>
        <span class="count" id="upcomingCount">0 streams</span>
    </div>
    <div class="grid" id="upcomingGrid"></div>
</section>

</main>

<footer>F1 Stream Center</footer>

<div class="player" id="player">
    <div class="player-header">
        <span class="player-title" id="playerTitle">F1 Stream</span>
        <button class="close" id="close">Sluiten ✕</button>
    </div>
    <div class="player-content" id="playerContent"></div>
</div>

<script>
const API = "https://api.ppv.st/api/streams";
const REFRESH = 60 * 1000;

const $ = id => document.getElementById(id);

let streams = [];
let activeStreamId = null;
let lastSuccessfulUpdate = null;

/* --------------------------------
   API
-------------------------------- */

async function loadStreams() {
    try {
        const response = await fetch(API, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!data.success || !Array.isArray(data.streams)) {
            throw new Error("Ongeldige API-response");
        }

        streams = extractF1(data.streams);
        lastSuccessfulUpdate = new Date();

        render();

        $("status").textContent = "● Verbonden";
        $("status").style.color = "#20cf87";

        $("stats").textContent =
            `${streams.length} F1 streams geladen · Laatste update: ${
                lastSuccessfulUpdate.toLocaleTimeString("nl-NL")
            }`;

    } catch (error) {
        console.error("API:", error);

        $("status").textContent = "● Verbindingsprobleem";
        $("status").style.color = "#e10600";

        // Bestaande streams blijven zichtbaar bij een tijdelijke API-fout.
        if (streams.length === 0) {
            $("liveGrid").innerHTML =
                message("Verbinding mislukt", "Probeer het later opnieuw.");

            $("upcomingGrid").innerHTML = "";
        }
    }
}

/* --------------------------------
   F1 FILTER
-------------------------------- */

function extractF1(categories) {
    const result = [];

    for (const category of categories) {
        for (const stream of category.streams || []) {

            const categoryName =
                category.category || stream.category_name || "";

            const searchable = [
                categoryName,
                stream.name || "",
                stream.tag || "",
                stream.uri_name || ""
            ].join(" ").toLowerCase();

            // Alleen duidelijke F1-aanduidingen.
            const isF1 =
                /\bformula\s*1\b/.test(searchable) ||
                /\bf1\b/.test(searchable);

            if (isF1) {
                result.push({
                    ...stream,
                    category: categoryName
                });
            }
        }
    }

    // Dubbele streams verwijderen op basis van ID.
    return [...new Map(
        result.map(s => [String(s.id), s])
    ).values()];
}

/* --------------------------------
   STATUS
-------------------------------- */

function getState(stream) {
    const now = Date.now();

    const start = Number(stream.starts_at || 0) * 1000;
    const end = Number(stream.ends_at || 0) * 1000;

    if (Number(stream.always_live) === 1) {
        return "live";
    }

    if (start && end && now >= start && now <= end) {
        return "live";
    }

    if (!start || start > now) {
        return "upcoming";
    }

    return "past";
}

/* --------------------------------
   RENDER
-------------------------------- */

function render() {
    const live = [];
    const upcoming = [];

    for (const stream of streams) {
        const state = getState(stream);

        if (state === "live") live.push(stream);
        if (state === "upcoming") upcoming.push(stream);
    }

    live.sort((a, b) =>
        Number(a.starts_at || 0) - Number(b.starts_at || 0)
    );

    upcoming.sort((a, b) =>
        Number(a.starts_at || 0) - Number(b.starts_at || 0)
    );

    $("liveCount").textContent = live.length + " streams";
    $("upcomingCount").textContent = upcoming.length + " streams";

    renderGrid("liveGrid", live);
    renderGrid("upcomingGrid", upcoming);
}

function renderGrid(id, items) {
    const grid = $(id);
    grid.replaceChildren();

    if (items.length === 0) {
        grid.appendChild(message(
            id === "liveGrid"
                ? "Geen live sessies"
                : "Geen aankomende sessies",
            "Er zijn momenteel geen streams in deze categorie."
        ));
        return;
    }

    for (const stream of items) {
        grid.appendChild(createCard(stream));
    }
}

/* --------------------------------
   CARD
-------------------------------- */

function createCard(stream) {
    const state = getState(stream);

    const card = document.createElement("article");
    card.className = "card";

    if (stream.poster) {
        const img = document.createElement("img");
        img.className = "poster";
        img.src = stream.poster;
        img.alt = "";
        img.loading = "lazy";
        img.onerror = () => img.remove();
        card.appendChild(img);
    }

    const fade = document.createElement("div");
    fade.className = "fade";
    card.appendChild(fade);

    const badges = document.createElement("div");
    badges.className = "badges";

    const badge = document.createElement("span");
    badge.className = "badge " + state;
    badge.textContent = state === "live" ? "● LIVE" : "UPCOMING";
    badges.appendChild(badge);

    if (!stream.iframe) {
        const missing = document.createElement("span");
        missing.className = "badge no-embed";
        missing.textContent = "GEEN EMBED";
        badges.appendChild(missing);
    }

    card.appendChild(badges);

    const content = document.createElement("div");
    content.className = "content";

    const title = document.createElement("h3");
    title.textContent = stream.name || "Formula 1";
    content.appendChild(title);

    const tag = document.createElement("p");
    tag.textContent = stream.tag || stream.category || "Formula 1";
    content.appendChild(tag);

    if (stream.starts_at) {
        const time = document.createElement("div");
        time.className = "time";

        time.textContent =
            new Date(Number(stream.starts_at) * 1000)
            .toLocaleString("nl-NL", {
                weekday: "short",
                day: "numeric",
                month: "short",
                hour: "2-digit",
                minute: "2-digit"
            });

        content.appendChild(time);
    }

    const button = document.createElement("button");
    button.className = "watch";

    if (stream.iframe) {
        button.textContent = "▶ Stream openen";
    } else {
        button.textContent = "Embed niet beschikbaar";
    }

    button.addEventListener("click", event => {
        event.stopPropagation();
        openPlayer(stream);
    });

    content.appendChild(button);
    card.appendChild(content);

    card.addEventListener("click", () => openPlayer(stream));

    return card;
}

/* --------------------------------
   PLAYER - URL OR HTML
-------------------------------- */

function openPlayer(stream) {
    $("playerTitle").textContent = stream.name || "F1 Stream";
    const container = $("playerContent");

    container.replaceChildren();

    const value = String(stream.iframe || "").trim();

    if (!value) {
        showPlayerMessage(
            "Geen embed beschikbaar",
            "De API heeft voor deze stream geen iframe of embed-URL meegegeven. De stream kan daarom niet via deze pagina worden afgespeeld."
        );
        return;
    }

    try {
        let iframe;

        // Optie 1: de API geeft volledige iframe HTML terug.
        if (/<iframe[\s>]/i.test(value)) {
            const doc = new DOMParser().parseFromString(
                value,
                "text/html"
            );

            iframe = doc.querySelector("iframe");

            if (!iframe || !iframe.getAttribute("src")) {
                throw new Error("Ongeldige iframe-code");
            }

            // Bestaande embed-attributen behouden.
            iframe = document.importNode(iframe, true);
        }

        // Optie 2: de API geeft alleen een embed-URL terug.
        else {
            const url = new URL(value);

            if (!["http:", "https:"].includes(url.protocol)) {
                throw new Error("Ongeldig URL-protocol");
            }

            iframe = document.createElement("iframe");
            iframe.src = url.href;
            iframe.allowFullscreen = true;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
        }

        iframe.style.width = "100%";
        iframe.style.height = "100%";
        iframe.style.border = "0";

        container.appendChild(iframe);

        activeStreamId = String(stream.id);
        showPlayer();

    } catch (error) {
        console.error("Embed error:", error);

        showPlayerMessage(
            "Embed kon niet worden geladen",
            "De API heeft embedgegevens teruggestuurd die niet als geldige iframe of HTTP(S)-URL konden worden verwerkt."
        );
    }
}

function showPlayerMessage(title, description) {
    const box = document.createElement("div");
    box.className = "player-message";

    const heading = document.createElement("h2");
    heading.textContent = title;

    const text = document.createElement("p");
    text.textContent = description;

    box.append(heading, text);
    $("playerContent").appendChild(box);

    activeStreamId = null;
    showPlayer();
}

function showPlayer() {
    $("player").classList.add("open");
    document.body.style.overflow = "hidden";
}

function closePlayer() {
    $("player").classList.remove("open");
    $("playerContent").replaceChildren();
    document.body.style.overflow = "";
    activeStreamId = null;
}

$("close").addEventListener("click", closePlayer);

document.addEventListener("keydown", event => {
    if (event.key === "Escape") closePlayer();
});

/* --------------------------------
   HELPERS
-------------------------------- */

function message(title, description) {
    const div = document.createElement("div");
    div.className = "message";

    const strong = document.createElement("strong");
    strong.textContent = title;

    const text = document.createElement("span");
    text.textContent = description;

    div.append(strong, text);
    return div;
}

/* --------------------------------
   AUTOMATIC UPDATES
-------------------------------- */

// Eerste keer direct ophalen.
loadStreams();

// Iedere minuut opnieuw ophalen.
// Nieuwe streams worden automatisch toegevoegd.
setInterval(loadStreams, REFRESH);

// LIVE/UPCOMING status ook lokaal opnieuw berekenen.
setInterval(render, 15000);

</script>
</body>
</html>
