<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>F1 Live</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080808;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 22px 35px;
            background: #101010;
            border-bottom: 1px solid #242424;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: #e10600;
        }

        #status {
            color: #888;
            font-size: 13px;
        }

        main {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        h1 {
            margin: 0 0 25px;
            font-size: 32px;
        }

        #streams {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: #121212;
            border: 1px solid #252525;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: .2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #e10600;
        }

        .poster {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #1c1c1c;
        }

        .info {
            padding: 15px;
        }

        .name {
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 8px;
        }

        .tag {
            color: #999;
            font-size: 13px;
        }

        .live {
            display: inline-block;
            margin-top: 12px;
            padding: 5px 8px;
            border-radius: 5px;
            background: #e10600;
            font-size: 11px;
            font-weight: bold;
        }

        .empty {
            color: #888;
            padding: 30px 0;
        }

        /* Player */

        #player {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
        }

        #playerHeader {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: #111;
        }

        #playerTitle {
            font-weight: bold;
        }

        #closePlayer {
            border: 0;
            background: #e10600;
            color: white;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #frameContainer {
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #frameContainer iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .no-embed {
            color: #aaa;
            text-align: center;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px;
            }

            main {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <span>F1</span> Live
    </div>

    <div id="status">
        Laden...
    </div>
</header>

<main>
    <h1>Formula 1</h1>

    <div id="streams">
        <div class="empty">Streams laden...</div>
    </div>
</main>

<!-- Player -->
<div id="player">
    <div id="playerHeader">
        <div id="playerTitle">F1</div>
        <button id="closePlayer">Sluiten</button>
    </div>

    <div id="frameContainer"></div>
</div>

<script>
    const API_URL = "https://api.ppv.st/api/streams";

    const streamsContainer = document.getElementById("streams");
    const statusElement = document.getElementById("status");

    const player = document.getElementById("player");
    const playerTitle = document.getElementById("playerTitle");
    const frameContainer = document.getElementById("frameContainer");
    const closePlayer = document.getElementById("closePlayer");


    async function loadStreams() {
        try {
            statusElement.textContent = "Streams ophalen...";

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("API request mislukt");
            }

            const data = await response.json();

            if (!data.success || !Array.isArray(data.streams)) {
                throw new Error("Ongeldige API-response");
            }

            /*
             * Zoek alle streams die bij Formula 1 horen.
             *
             * We controleren zowel de categorie als de naam/tag,
             * omdat F1-events niet noodzakelijk allemaal dezelfde
             * categorienaam hoeven te gebruiken.
             */
            const f1Streams = [];

            for (const category of data.streams) {

                const categoryName =
                    String(category.category || "").toLowerCase();

                for (const stream of (category.streams || [])) {

                    const text = [
                        categoryName,
                        stream.category_name || "",
                        stream.name || "",
                        stream.tag || "",
                        stream.uri_name || ""
                    ]
                    .join(" ")
                    .toLowerCase();

                    if (
                        text.includes("formula 1") ||
                        text.includes("formula1") ||
                        text.includes("f1")
                    ) {
                        f1Streams.push(stream);
                    }
                }
            }

            renderStreams(f1Streams);

            const time = new Date(
                (data.timestamp || Math.floor(Date.now() / 1000)) * 1000
            );

            statusElement.textContent =
                `${f1Streams.length} F1 stream(s) • ${time.toLocaleTimeString()}`;

        } catch (error) {
            console.error(error);

            statusElement.textContent = "Fout";

            streamsContainer.innerHTML = `
                <div class="empty">
                    Kon de streams niet laden.<br><br>
                    ${escapeHtml(error.message)}
                </div>
            `;
        }
    }


    function renderStreams(streams) {

        streamsContainer.innerHTML = "";

        if (streams.length === 0) {
            streamsContainer.innerHTML = `
                <div class="empty">
                    Er zijn momenteel geen F1-streams beschikbaar.
                </div>
            `;

            return;
        }

        streams.forEach(stream => {

            const card = document.createElement("div");
            card.className = "card";

            const start = stream.starts_at
                ? new Date(stream.starts_at * 1000)
                : null;

            const end = stream.ends_at
                ? new Date(stream.ends_at * 1000)
                : null;

            const now = Date.now();

            const isLive =
                stream.always_live === 1 ||
                (start && end &&
                 now >= start.getTime() &&
                 now <= end.getTime());

            card.innerHTML = `
                ${
                    stream.poster
                    ? `<img
                        class="poster"
                        src="${escapeAttribute(stream.poster)}"
                        alt=""
                        loading="lazy"
                      >`
                    : `<div class="poster"></div>`
                }

                <div class="info">
                    <div class="name">
                        ${escapeHtml(stream.name || "F1 Stream")}
                    </div>

                    <div class="tag">
                        ${escapeHtml(stream.tag || "Formula 1")}
                    </div>

                    ${
                        isLive
                        ? `<div class="live">● LIVE</div>`
                        : ""
                    }
                </div>
            `;

            card.addEventListener("click", () => {
                openPlayer(stream);
            });

            streamsContainer.appendChild(card);
        });
    }


    function openPlayer(stream) {

        playerTitle.textContent =
            stream.name || "F1 Live";

        frameContainer.innerHTML = "";

        if (!stream.iframe) {

            frameContainer.innerHTML = `
                <div class="no-embed">
                    Voor deze stream is geen embed beschikbaar.
                </div>
            `;

        } else {

            /*
             * De API levert zelf de iframe.
             * Deze wordt rechtstreeks weergegeven zonder
             * de embed-instellingen aan te passen.
             */
            frameContainer.innerHTML = stream.iframe;
        }

        player.style.display = "block";
        document.body.style.overflow = "hidden";
    }


    function closePlayerWindow() {

        player.style.display = "none";
        frameContainer.innerHTML = "";
        document.body.style.overflow = "";
    }


    closePlayer.addEventListener(
        "click",
        closePlayerWindow
    );


    document.addEventListener("keydown", event => {

        if (event.key === "Escape") {
            closePlayerWindow();
        }

    });


    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    function escapeAttribute(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll('"', "&quot;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;");
    }


    // Eerste keer laden
    loadStreams();

    // Volgens de API-documentatie ongeveer iedere minuut verversen
    setInterval(loadStreams, 60 * 1000);

</script>

</body>
</html>
