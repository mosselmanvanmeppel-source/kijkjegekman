<body>

<header>
  <div class="header">
    <div class="logo">
      Stream<span>Center</span>
    </div>

    <div class="search">
      <input
        id="search"
        type="search"
        placeholder="Zoek naar F1, voetbal, tennis..."
      >
    </div>
  </div>
</header>

<main>

  <section class="hero">
    <h1>Live Streams</h1>
    <p>Beschikbare streams</p>
    <div id="status" class="status">
      Verbinding maken...
    </div>
  </section>

  <div id="error" class="error"></div>

  <div id="content">
    <div class="empty">
      Streams laden...
    </div>
  </div>

</main>

<div id="overlay" class="overlay">

  <div class="player">

    <div class="player-header">
      <div id="playerTitle" class="player-title">
        Stream
      </div>

      <button
        class="close"
        onclick="closePlayer()">
        Sluiten
      </button>
    </div>

    <video
      id="video"
      controls
      playsinline
      style="display:none">
    </video>

    <iframe
      id="iframe"
      allow="autoplay; fullscreen"
      allowfullscreen
      style="display:none">
    </iframe>

  </div>

</div>

<script>

  /*
   * ==========================================================
   * CONFIG
   * ==========================================================
   */

  const DEFAULT_DOMAIN = "api.ppv.st";

  const PING_PATH = "/api/ping";
  const STREAMS_PATH = "/api/streams";

  let streams = [];
  let domains = [];


  /*
   * ==========================================================
   * HELPERS
   * ==========================================================
   */

  function cleanDomain(domain) {

    if (!domain) {
      return null;
    }

    domain = String(domain).trim();

    // https://example.com -> example.com
    domain = domain.replace(/^https?:\/\//i, "");

    // trailing slash verwijderen
    domain = domain.replace(/\/+$/, "");

    // eventuele path niet verwijderen:
    // sommige mirrors kunnen namelijk een eigen API-base hebben

    return domain;
  }


  function makeUrl(domain, path) {

    domain = cleanDomain(domain);

    if (!domain) {
      return null;
    }

    return `https://${domain}${path}`;
  }


  function getValue(object, keys) {

    for (const key of keys) {

      if (
        object &&
        object[key] !== undefined &&
        object[key] !== null &&
        object[key] !== ""
      ) {
        return object[key];
      }

    }

    return "";
  }


  /*
   * ==========================================================
   * PING
   *
   * GET /api/ping
   *
   * Verwacht bijvoorbeeld:
   *
   * {
   *   "success": true,
   *   "domains": [
   *      "api.ppv.st",
   *      "mirror.example.com"
   *   ]
   * }
   * ==========================================================
   */

  async function getDomains() {

    const pingUrl = makeUrl(
      DEFAULT_DOMAIN,
      PING_PATH
    );

    const response = await fetch(
      pingUrl,
      {
        method: "GET",
        headers: {
          "Accept": "application/json"
        },
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        `Ping mislukt (${response.status})`
      );
    }

    const data = await response.json();

    if (
      data &&
      data.success === false
    ) {
      throw new Error("API ping returned success=false");
    }

    const result = [];

    // Default domain altijd meenemen.
    result.push(DEFAULT_DOMAIN);

    if (
      data &&
      Array.isArray(data.domains)
    ) {

      for (const domain of data.domains) {

        const cleaned = cleanDomain(domain);

        if (
          cleaned &&
          !result.includes(cleaned)
        ) {
          result.push(cleaned);
        }

      }
    }

    return result;
  }


  /*
   * ==========================================================
   * STREAM API
   *
   * Probeert iedere mirror totdat er eentje werkt.
   * ==========================================================
   */

  async function getStreams() {

    let lastError = null;

    for (const domain of domains) {

      try {

        const url = makeUrl(
          domain,
          STREAMS_PATH
        );

        console.log(
          "Streams proberen:",
          url
        );

        const response = await fetch(
          url,
          {
            method: "GET",
            headers: {
              "Accept": "application/json"
            },
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const data = await response.json();

        const result = extractStreams(data);

        if (!Array.isArray(result)) {
          throw new Error(
            "Ongeldige stream response"
          );
        }

        return {
          domain,
          streams: result
        };

      } catch (error) {

        console.warn(
          `Mirror ${domain} werkt niet:`,
          error
        );

        lastError = error;
      }
    }

    throw lastError ||
      new Error("Geen werkende API mirror gevonden.");
  }


  /*
   * ==========================================================
   * JSON STRUCTUREN
   * ==========================================================
   */

  function extractStreams(data) {

    if (Array.isArray(data)) {
      return data;
    }

    if (!data || typeof data !== "object") {
      return [];
    }

    const possibleKeys = [
      "streams",
      "data",
      "results",
      "events",
      "channels",
      "items"
    ];

    for (const key of possibleKeys) {

      if (Array.isArray(data[key])) {
        return data[key];
      }

    }

    return [];
  }


  function normalize(stream) {

    const title = getValue(stream, [
      "title",
      "name",
      "event",
      "event_name",
      "channel_name",
      "label"
    ]) || "Onbekende stream";


    const category = getValue(stream, [
      "category",
      "sport",
      "type",
      "league",
      "competition"
    ]) || "Overig";


    const image = getValue(stream, [
      "thumbnail",
      "thumbnail_url",
      "image",
      "image_url",
      "logo",
      "poster"
    ]);


    const url = getValue(stream, [
      "url",
      "stream_url",
      "stream",
      "link",
      "embed",
      "embed_url",
      "m3u8",
      "source"
    ]);


    const searchable = (
      title +
      " " +
      category +
      " " +
      JSON.stringify(stream)
    ).toLowerCase();


    const f1 =
      searchable.includes("f1") ||
      searchable.includes("formula 1") ||
      searchable.includes("formula1") ||
      searchable.includes("formula one");


    return {
      raw: stream,
      title: String(title),
      category: String(category),
      image: image ? String(image) : "",
      url: url ? String(url) : "",
      f1
    };
  }


  /*
   * ==========================================================
   * HTML
   * ==========================================================
   */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function createCard(stream) {

    const image = stream.image
      ? `
        <img
          src="${escapeHtml(stream.image)}"
          loading="lazy"
          alt="">
      `
      : "";


    return `
      <article
        class="card"
        data-index="${streams.indexOf(stream)}"
        onclick="openStreamByIndex(${streams.indexOf(stream)})">

        <div class="thumbnail">

          ${image}

          <span class="live">
            LIVE
          </span>

        </div>

        <div class="card-content">

          <div class="title">
            ${escapeHtml(stream.title)}
          </div>

          <div class="category">
            ${escapeHtml(stream.category)}
          </div>

        </div>

      </article>
    `;
  }


  function render(list) {

    const content =
      document.getElementById("content");


    if (!list.length) {

      content.innerHTML = `
        <div class="empty">
          Geen streams gevonden.
        </div>
      `;

      return;
    }


    const groups = {};


    for (const stream of list) {

      const category =
        stream.f1
          ? "Formula 1"
          : stream.category || "Overig";


      if (!groups[category]) {
        groups[category] = [];
      }


      groups[category].push(stream);
    }


    const categories =
      Object.keys(groups).sort((a, b) => {

        if (a === "Formula 1") {
          return -1;
        }

        if (b === "Formula 1") {
          return 1;
        }

        return a.localeCompare(b);
      });


    content.innerHTML =
      categories.map(category => {

        const items =
          groups[category];


        return `
          <section class="section">

            <div class="section-header">

              <div class="section-title">
                ${escapeHtml(category)}
              </div>

              <div class="count">
                ${items.length}
                ${items.length === 1
                  ? "stream"
                  : "streams"}
              </div>

            </div>

            <div class="grid">
              ${items.map(createCard).join("")}
            </div>

          </section>
        `;

      }).join("");
  }


  /*
   * ==========================================================
   * PLAYER
   * ==========================================================
   */

  function openStreamByIndex(index) {

    const stream = streams[index];

    if (!stream) {
      return;
    }

    openStream(stream);
  }


  function openStream(stream) {

    if (!stream.url) {

      alert(
        "Voor deze stream is geen URL gevonden."
      );

      return;
    }


    const overlay =
      document.getElementById("overlay");

    const video =
      document.getElementById("video");

    const iframe =
      document.getElementById("iframe");

    const title =
      document.getElementById("playerTitle");


    title.textContent = stream.title;


    video.pause();
    video.removeAttribute("src");

    iframe.src = "";


    video.style.display = "none";
    iframe.style.display = "none";


    const url = stream.url.toLowerCase();


    /*
     * MP4/WebM/Ogg
     */

    if (
      url.includes(".mp4") ||
      url.includes(".webm") ||
      url.includes(".ogg")
    ) {

      video.src = stream.url;
      video.style.display = "block";

      video.play().catch(() => {});


    /*
     * HLS
     *
     * Moderne browsers zoals Safari kunnen
     * dit native afspelen.
     */

    } else if (
      url.includes(".m3u8")
    ) {

      video.src = stream.url;
      video.style.display = "block";

      video.play().catch(() => {});


    /*
     * Anders behandelen als embed URL.
     */

    } else {

      iframe.src = stream.url;
      iframe.style.display = "block";
    }


    overlay.classList.add("active");
  }


  function closePlayer() {

    const overlay =
      document.getElementById("overlay");

    const video =
      document.getElementById("video");

    const iframe =
      document.getElementById("iframe");


    video.pause();
    video.removeAttribute("src");

    iframe.src = "";

    overlay.classList.remove("active");
  }


  /*
   * ==========================================================
   * SEARCH
   * ==========================================================
   */

  document
    .getElementById("search")
    .addEventListener("input", event => {

      const query =
        event.target.value
          .trim()
          .toLowerCase();


      if (!query) {

        render(streams);

        return;
      }


      const filtered =
        streams.filter(stream => {

          return (
            stream.title
              .toLowerCase()
              .includes(query) ||

            stream.category
              .toLowerCase()
              .includes(query) ||

            JSON.stringify(stream.raw)
              .toLowerCase()
              .includes(query)
          );

        });


      render(filtered);
    });


  /*
   * ==========================================================
   * KEYBOARD / OVERLAY
   * ==========================================================
   */

  document
    .getElementById("overlay")
    .addEventListener("click", event => {

      if (
        event.target.id === "overlay"
      ) {
        closePlayer();
      }

    });


  document.addEventListener(
    "keydown",
    event => {

      if (event.key === "Escape") {
        closePlayer();
      }

    }
  );


  /*
   * ==========================================================
   * INITIAL LOAD
   * ==========================================================
   */

  async function init() {

    const status =
      document.getElementById("status");

    const error =
      document.getElementById("error");


    try {

      status.textContent =
        "API mirrors ophalen...";


      /*
       * 1. Eerst /api/ping
       */

      domains =
        await getDomains();


      status.textContent =
        `${domains.length} API mirror(s) gevonden. Streams ophalen...`;


      /*
       * 2. Daarna /api/streams
       */

      const result =
        await getStreams();


      /*
       * 3. Normaliseren
       */

      streams =
        result.streams
          .map(normalize);


      /*
       * F1 bovenaan
       */

      streams.sort((a, b) => {

        if (a.f1 && !b.f1) {
          return -1;
        }

        if (!a.f1 && b.f1) {
          return 1;
        }

        return a.title.localeCompare(
          b.title,
          undefined,
          {
            sensitivity: "base"
          }
        );

      });


      /*
       * 4. Render
       */

      render(streams);


      status.textContent =
        `${streams.length} streams geladen via ${result.domain}`;


    } catch (err) {

      console.error(err);


      status.textContent =
        "Verbinding mislukt";


      error.textContent =
        "Streams konden niet worden geladen: " +
        err.message;


      error.style.display =
        "block";


      document.getElementById("content")
        .innerHTML = `
          <div class="empty">
            Geen verbinding met de stream API.
          </div>
        `;
    }
  }


  /*
   * Start
   */

  init();


  /*
   * Iedere minuut opnieuw controleren.
   *
   * Hierdoor worden ook gewijzigde mirrors
   * uit /api/ping automatisch opgehaald.
   */

  setInterval(
    init,
    60 * 1000
  );

</script>

</body>
</html>
