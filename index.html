<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Live</title>
<style>
*{box-sizing:border-box}
:root{--bg:#070707;--panel:#111;--line:#242424;--text:#fff;--muted:#929292;--red:#e10600;--green:#20c76a}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(7,7,7,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header{max-width:1400px;margin:auto;padding:17px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:800}
.logo b{display:grid;place-items:center;width:35px;height:35px;border-radius:9px;background:var(--red);font-size:14px}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(32,199,106,.7)}
main{max-width:1400px;margin:auto;padding:32px 24px 40px}
h1{margin:0 0 8px;font-size:clamp(34px,5vw,54px);line-height:1;letter-spacing:-1.5px}
.subtitle{margin:0;color:var(--muted)}
.section{margin-top:36px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
h2{margin:0;font-size:20px}.count{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;transition:.15s}
.card:hover{transform:translateY(-2px);border-color:#383838}
.poster{position:relative;aspect-ratio:16/9;background:#0c0c0c}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster-fallback{width:100%;height:100%;display:grid;place-items:center;font-size:42px;font-weight:900;color:#3e3e3e}
.badge{position:absolute;top:12px;left:12px;padding:6px 9px;border-radius:7px;font-size:11px;font-weight:800;text-transform:uppercase}
.live{background:var(--red);color:#fff}.upcoming{background:rgba(0,0,0,.75);color:#fff;border:1px solid #444}
.body{padding:16px}.title{margin:0 0 7px;font-size:17px;line-height:1.25}.time{font-size:13px;color:var(--muted)}
button{font:inherit}
.watch{width:100%;margin-top:15px;border:0;border-radius:9px;padding:11px 14px;background:#fff;color:#000;font-weight:800;cursor:pointer}
.watch.live-btn{background:var(--red);color:#fff}
.empty{padding:38px 20px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
.error{display:none;margin-top:25px;padding:13px 15px;border-radius:10px;background:#250909;border:1px solid #5a1717;color:#ffaaa7}
footer{text-align:center;color:#555;font-size:12px;padding:0 20px 28px}
.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);backdrop-filter:blur(9px);padding:12px;align-items:center;justify-content:center}.overlay.open{display:flex}.player{width:min(1280px,100%);max-height:calc(100vh - 24px);background:#080808;border:1px solid #292929;border-radius:15px;overflow:hidden;display:flex;flex-direction:column}.playerbar{min-height:58px;padding:10px 12px 10px 17px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222;flex-shrink:0}.playername{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;flex:1;min-width:0}.player-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}.player-btn,.close{height:36px;border:0;border-radius:9px;background:#1b1b1b;color:#fff;padding:0 11px;font-weight:700;cursor:pointer;white-space:nowrap}.player-btn:hover,.close:hover{background:#292929}.close{width:36px;padding:0;font-size:21px}.frame-wrap{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 105px);background:#000;flex-shrink:1;overflow:hidden}.frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.player-error{position:absolute;inset:0;display:grid;place-items:center;padding:25px;text-align:center;color:#aaa;background:#080808}.player-error strong{display:block;color:#fff;margin-bottom:8px}.stream-select{height:36px;max-width:230px;border:1px solid #333;border-radius:9px;background:#151515;color:#fff;padding:0 9px;font:inherit;font-size:13px;font-weight:700}@media(max-width:700px){.header{padding:14px 15px}main{padding:25px 15px 35px}.grid{grid-template-columns:1fr}.overlay{padding:6px}.player{max-height:calc(100vh - 12px);border-radius:10px}.playerbar{padding:8px;gap:6px;flex-wrap:wrap}.playername{width:100%;flex-basis:100%;order:0}.player-actions{width:100%;order:1}.player-btn,.close,.stream-select{height:34px}.stream-select{max-width:none;flex:1}.frame-wrap{aspect-ratio:16/9;max-height:calc(100vh - 125px)}}
</style>
</head>
<body>

<header>
  <div class="header">
    <div class="logo"><b>F1</b><span>F1 Live</span></div>
    <div class="status"><span class="dot"></span><span id="status">Verbinden...</span></div>
  </div>
</header>

<main>
  <h1>Formula 1</h1>
  <p class="subtitle">Live en aankomende sessies</p>

  <div id="error" class="error"></div>

  <section class="section">
    <div class="section-head">
      <h2>Live</h2>
      <span id="liveCount" class="count">0 streams</span>
    </div>
    <div id="liveGrid" class="grid"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Upcoming</h2>
      <span id="upcomingCount" class="count">0 streams</span>
    </div>
    <div id="upcomingGrid" class="grid"></div>
  </section>
</main>

<footer>Gemaakt door een onafhankelijke maker uit Meppel.</footer>

<div id="overlay" class="overlay">
  <div class="player">
    <div class="playerbar">
      <div id="playerName" class="playername">F1</div>
      <div class="player-actions">
        <select id="streamSelect" class="stream-select" aria-label="Kies stream"></select>
        <button id="fullscreen" class="player-btn" type="button">⛶ Fullscreen</button>
        <button id="close" class="close" type="button" aria-label="Leave / Sluiten">×</button>
      </div>
    </div>
    <div id="frameWrap" class="frame-wrap"></div>
  </div>
</div>

<script>
"use strict";

const API = "https://api.ppv.st/api/streams";
const REFRESH_MS = 60000;

const $ = id => document.getElementById(id);
const liveGrid = $("liveGrid");
const upcomingGrid = $("upcomingGrid");
const liveCount = $("liveCount");
const upcomingCount = $("upcomingCount");
const status = $("status");
const errorBox = $("error");
const overlay = $("overlay");
const frameWrap = $("frameWrap");
const playerName = $("playerName");
const streamSelect = $("streamSelect");
const fullscreenButton = $("fullscreen");
let playerStreams = [];

function dateMs(v){
  if(v === undefined || v === null || v === "") return NaN;
  const n = Number(v);
  if(Number.isFinite(n)){
    return n < 100000000000 ? n * 1000 : n;
  }
  const d = Date.parse(v);
  return Number.isNaN(d) ? NaN : d;
}

function formatTime(v){
  const ms = dateMs(v);
  if(!Number.isFinite(ms)) return "Tijd onbekend";
  return new Intl.DateTimeFormat("nl-NL",{dateStyle:"medium",timeStyle:"short"}).format(new Date(ms));
}

function f1(stream){
  const s = [
    stream.name,
    stream.tag,
    stream.category,
    stream.category_name
  ].filter(Boolean).join(" ").toLowerCase();
  return s.includes("formula 1") || s.includes("formula1") || /\bf1\b/.test(s);
}

function live(stream){
  if(stream.always_live === true || Number(stream.always_live) === 1) return true;
  const now = Date.now();
  const start = dateMs(stream.starts_at);
  const end = dateMs(stream.ends_at);
  return Number.isFinite(start) && start <= now && (!Number.isFinite(end) || end > now);
}

function upcoming(stream){
  if(stream.always_live === true || Number(stream.always_live) === 1) return false;
  const start = dateMs(stream.starts_at);
  return Number.isFinite(start) && start > Date.now();
}

function past(stream){
  if(stream.always_live === true || Number(stream.always_live) === 1) return false;
  const end = dateMs(stream.ends_at);
  return Number.isFinite(end) && end <= Date.now();
}

/*
 * The API documents iframe as a string. This function supports
 * both a plain URL and a complete iframe element.
 */
function makeIframe(value, title){
  if(typeof value !== "string") return null;
  const raw = value.trim();
  if(!raw) return null;

  if(/<iframe[\s>]/i.test(raw)){
    const parsed = new DOMParser().parseFromString(raw,"text/html");
    const source = parsed.querySelector("iframe");
    if(!source) return null;

    const src = source.getAttribute("src");
    if(!src) return null;

    const frame = document.createElement("iframe");
    frame.src = src;
    frame.title = source.getAttribute("title") || title || "F1";
    frame.allow = source.getAttribute("allow") || "autoplay; fullscreen; picture-in-picture";
    frame.referrerPolicy = source.getAttribute("referrerpolicy") || "strict-origin-when-cross-origin";
    frame.allowFullscreen = true;
    return frame;
  }

  try{
    const url = new URL(raw, location.href);
    if(!["http:","https:"].includes(url.protocol)) return null;

    const frame = document.createElement("iframe");
    frame.src = url.href;
    frame.title = title || "F1";
    frame.allow = "autoplay; fullscreen; picture-in-picture";
    frame.referrerPolicy = "strict-origin-when-cross-origin";
    frame.allowFullscreen = true;
    return frame;
  }catch{
    return null;
  }
}

function streamLabel(stream){
  const text=[stream.name,stream.title,stream.language,stream.lang,stream.tag,stream.category_name].filter(Boolean).join(" ").toLowerCase();
  if(/(^|[\s\-_])(nl|nederlands|dutch)([\s\-_]|$)/i.test(text)) return "🇳🇱 Nederlands";
  if(/(^|[\s\-_])(en|eng|english)([\s\-_]|$)/i.test(text)) return "🇬🇧 English";
  return stream.name || "F1 stream";
}
function fillStreamSelect(stream,streams){
  playerStreams=streams&&streams.length?streams:[stream]; streamSelect.replaceChildren();
  playerStreams.forEach((item,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=streamLabel(item);streamSelect.appendChild(o);});
  streamSelect.value=String(Math.max(0,playerStreams.indexOf(stream))); streamSelect.style.display=playerStreams.length>1?"block":"none";
}
function setPlayerStream(stream){
  playerName.textContent=stream.name||"F1"; frameWrap.replaceChildren();
  const frame=makeIframe(stream.iframe,stream.name||"F1");
  if(frame) frameWrap.appendChild(frame); else {const box=document.createElement("div");box.className="player-error";const inner=document.createElement("div");const strong=document.createElement("strong");strong.textContent="Geen geldige embed ontvangen.";const text=document.createElement("span");text.textContent="De API heeft voor deze stream geen bruikbare iframe-URL teruggegeven.";inner.append(strong,text);box.appendChild(inner);frameWrap.appendChild(box);}
}
function openPlayer(stream,allLiveStreams=[]){fillStreamSelect(stream,allLiveStreams.length?allLiveStreams:[stream]);setPlayerStream(stream);overlay.classList.add("open");document.body.style.overflow="hidden";}
function closePlayer(){overlay.classList.remove("open");frameWrap.replaceChildren();playerStreams=[];document.body.style.overflow="";if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});}
async function toggleFullscreen(){try{if(document.fullscreenElement) await document.exitFullscreen();else await document.querySelector(".player").requestFullscreen();}catch(err){console.warn("Fullscreen niet beschikbaar",err);}}
function updateFullscreenButton(){fullscreenButton.textContent=document.fullscreenElement?"⛶ Exit fullscreen":"⛶ Fullscreen";}

function card(stream,isLive,liveStreams=[]){
  const article = document.createElement("article");
  article.className = "card";

  const poster = document.createElement("div");
  poster.className = "poster";

  if(stream.poster){
    const img = document.createElement("img");
    img.src = stream.poster;
    img.alt = stream.name || "F1";
    img.loading = "lazy";
    img.onerror = () => {
      img.remove();
      const fallback = document.createElement("div");
      fallback.className = "poster-fallback";
      fallback.textContent = "F1";
      poster.appendChild(fallback);
    };
    poster.appendChild(img);
  }else{
    const fallback = document.createElement("div");
    fallback.className = "poster-fallback";
    fallback.textContent = "F1";
    poster.appendChild(fallback);
  }

  const badge = document.createElement("span");
  badge.className = "badge " + (isLive ? "live" : "upcoming");
  badge.textContent = isLive ? "Live" : "Upcoming";
  poster.appendChild(badge);

  const body = document.createElement("div");
  body.className = "body";

  const title = document.createElement("h3");
  title.className = "title";
  title.textContent = stream.name || "F1";

  const time = document.createElement("div");
  time.className = "time";
  time.textContent = isLive ? "Nu live" : formatTime(stream.starts_at);

  const button = document.createElement("button");
  button.className = "watch" + (isLive ? " live-btn" : "");
  button.type = "button";
  button.textContent = isLive ? "Kijk live" : "Open stream";
  button.addEventListener("click", () => openPlayer(stream,isLive?liveStreams:[stream]));

  body.append(title,time,button);
  article.append(poster,body);
  return article;
}

function empty(container,text){
  const el = document.createElement("div");
  el.className = "empty";
  el.textContent = text;
  container.appendChild(el);
}

function render(streams){
  liveGrid.replaceChildren();
  upcomingGrid.replaceChildren();

  const filtered = streams.filter(f1).filter(s => !past(s));

  const liveStreams = filtered.filter(live).sort((a,b) => dateMs(a.starts_at)-dateMs(b.starts_at));
  const upcomingStreams = filtered.filter(upcoming).sort((a,b) => dateMs(a.starts_at)-dateMs(b.starts_at));

  liveCount.textContent = liveStreams.length + (liveStreams.length === 1 ? " stream" : " streams");
  upcomingCount.textContent = upcomingStreams.length + (upcomingStreams.length === 1 ? " stream" : " streams");

  if(liveStreams.length === 0) empty(liveGrid,"Er is momenteel geen F1-sessie live.");
  else liveStreams.forEach(s => liveGrid.appendChild(card(s,true,liveStreams)));

  if(upcomingStreams.length === 0) empty(upcomingGrid,"Geen aankomende F1-sessies gevonden.");
  else upcomingStreams.forEach(s => upcomingGrid.appendChild(card(s,false)));
}

async function load(){
  try{
    status.textContent = "Vernieuwen...";
    errorBox.style.display = "none";

    const response = await fetch(API,{cache:"no-store"});
    if(!response.ok) throw new Error("API HTTP " + response.status);

    const data = await response.json();
    if(!data || data.success !== true) throw new Error("API gaf geen succesvolle response.");

    const groups = Array.isArray(data.streams) ? data.streams : [];
    const streams = [];

    for(const group of groups){
      if(!group || !Array.isArray(group.streams)) continue;

      for(const item of group.streams){
        if(!item || typeof item !== "object") continue;

        streams.push({
          ...item,
          category: item.category || group.category || "",
          category_name: item.category_name || group.category || ""
        });
      }
    }

    render(streams);
    status.textContent = "Verbonden";
  }catch(err){
    console.error(err);
    status.textContent = "Verbindingsfout";
    errorBox.textContent = "Streams konden niet worden geladen: " + err.message;
    errorBox.style.display = "block";
  }
}

$("close").addEventListener("click",closePlayer);
fullscreenButton.addEventListener("click",toggleFullscreen);
streamSelect.addEventListener("change",e=>{const i=Number(e.target.value);if(playerStreams[i])setPlayerStream(playerStreams[i]);});
document.addEventListener("fullscreenchange",updateFullscreenButton);
overlay.addEventListener("click",e => { if(e.target === overlay) closePlayer(); });
document.addEventListener("keydown",e => { if(e.key === "Escape") closePlayer(); });

load();
setInterval(load,REFRESH_MS);
</script>
</body>
</html>
setInterval(load,REFRESH_MS);
</script>
</body>
</html>
