<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Live</title>
<style>
*{box-sizing:border-box}
:root{--bg:#070707;--card:#111;--border:#242424;--text:#fff;--muted:#929292;--red:#e10600;--green:#20c76a}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(7,7,7,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1400px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--red);display:grid;place-items:center;font-weight:900;font-size:17px}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(32,199,106,.7)}
main{max-width:1400px;margin:auto;padding:30px 24px 70px}
.hero{margin-bottom:30px}.hero h1{margin:0 0 8px;font-size:clamp(30px,5vw,52px);line-height:1;letter-spacing:-1.5px}.hero p{margin:0;color:var(--muted)}
.section{margin-top:35px}.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.section-title{margin:0;font-size:20px;font-weight:800}.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:16px;transition:.15s}
.card:hover{transform:translateY(-2px);background:#171717;border-color:#353535}
.poster{position:relative;aspect-ratio:16/9;background:#0c0c0c;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster-placeholder{width:100%;height:100%;display:grid;place-items:center;color:#444;font-size:42px;font-weight:900}
.badge{position:absolute;top:12px;left:12px;padding:6px 9px;border-radius:7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.badge-live{background:var(--red);color:#fff}.badge-upcoming{background:rgba(0,0,0,.75);color:#fff;border:1px solid rgba(255,255,255,.15)}
.card-body{padding:16px}.card-title{margin:0 0 7px;font-size:17px;font-weight:750;line-height:1.25}.card-time{color:var(--muted);font-size:13px}
.watch-btn{width:100%;margin-top:15px;padding:11px 14px;border:0;border-radius:9px;background:#fff;color:#000;font-size:14px;font-weight:800;cursor:pointer}
.watch-btn:hover{opacity:.85}.watch-btn.live{background:var(--red);color:#fff}
.empty{padding:45px 20px;border:1px dashed var(--border);border-radius:14px;text-align:center;color:var(--muted)}
.error{margin-bottom:25px;padding:14px 16px;border-radius:10px;background:rgba(225,6,0,.12);border:1px solid rgba(225,6,0,.35);color:#ff9b98;display:none}
.player-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.86);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px}
.player-overlay.open{display:flex}.player-window{width:min(1200px,100%);max-height:95vh;background:#080808;border:1px solid #282828;border-radius:16px;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.7)}
.player-header{min-height:58px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #222}
.player-title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close-btn{flex:0 0 auto;width:36px;height:36px;border:0;border-radius:9px;background:#1c1c1c;color:#fff;cursor:pointer;font-size:20px}
.player-container{position:relative;width:100%;aspect-ratio:16/9;background:#000}.player-container iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.player-message{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;background:#080808;color:var(--muted)}
.player-message-inner{max-width:500px}.player-message strong{display:block;margin-bottom:8px;color:#fff;font-size:18px}
.player-message code{display:block;margin-top:12px;padding:10px;border-radius:8px;background:#111;color:#aaa;font-size:12px;word-break:break-all}
@media(max-width:600px){.header-inner{padding:15px}main{padding:25px 15px 60px}.grid{grid-template-columns:1fr}.player-overlay{padding:8px}.player-window{border-radius:10px}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo"><div class="logo-mark">F1</div><span>F1 Live</span></div>
    <div class="status"><span class="status-dot"></span><span id="statusText">Verbinden...</span></div>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Formula 1</h1>
    <p>Live en aankomende sessies</p>
  </section>

  <div id="error" class="error"></div>

  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Live</h2>
      <span class="count" id="liveCount">0 streams</span>
    </div>
    <div id="liveGrid" class="grid"></div>
  </section>

  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Upcoming</h2>
      <span class="count" id="upcomingCount">0 streams</span>
    </div>
    <div id="upcomingGrid" class="grid"></div>
  </section>
</main>

<div id="playerOverlay" class="player-overlay">
  <div class="player-window">
    <div class="player-header">
      <div id="playerTitle" class="player-title">F1</div>
      <button id="closePlayer" class="close-btn" type="button" aria-label="Sluiten">×</button>
    </div>
    <div id="playerContainer" class="player-container"></div>
  </div>
</div>

<script>
"use strict";

const API_URL = "https://api.ppv.st/api/streams";
const REFRESH_INTERVAL = 60000;

const liveGrid = document.getElementById("liveGrid");
const upcomingGrid = document.getElementById("upcomingGrid");
const liveCount = document.getElementById("liveCount");
const upcomingCount = document.getElementById("upcomingCount");
const statusText = document.getElementById("statusText");
const errorBox = document.getElementById("error");
const playerOverlay = document.getElementById("playerOverlay");
const playerContainer = document.getElementById("playerContainer");
const playerTitle = document.getElementById("playerTitle");
const closePlayer = document.getElementById("closePlayer");

function formatDate(value) {
  if (!value) return "Tijd onbekend";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "Tijd onbekend";
  return new Intl.DateTimeFormat("nl-NL", {
    dateStyle: "medium",
    timeStyle: "short"
  }).format(date);
}

function isLive(stream) {
  if (stream.always_live === true) return true;
  const now = Date.now();
  const start = stream.starts_at ? new Date(stream.starts_at).getTime() : NaN;
  const end = stream.ends_at ? new Date(stream.ends_at).getTime() : NaN;
  if (Number.isNaN(start) || start > now) return false;
  return Number.isNaN(end) || now < end;
}

function isUpcoming(stream) {
  if (stream.always_live === true || !stream.starts_at) return false;
  const start = new Date(stream.starts_at).getTime();
  return !Number.isNaN(start) && start > Date.now();
}

function isPast(stream) {
  if (stream.always_live === true || !stream.ends_at) return false;
  const end = new Date(stream.ends_at).getTime();
  return !Number.isNaN(end) && end <= Date.now();
}

function isF1(stream) {
  const text = [
    stream.name,
    stream.tag,
    stream.category_name,
    stream.category
  ].filter(Boolean).join(" ").toLowerCase();

  return text.includes("formula 1") ||
         text.includes("formula1") ||
         /\bf1\b/.test(text);
}

/* Accepts either a complete <iframe>...</iframe> or a plain URL. */
function createEmbed(value, title) {
  if (typeof value !== "string") return null;
  const raw = value.trim();
  if (!raw) return null;

  if (/<iframe[\s>]/i.test(raw)) {
    const doc = new DOMParser().parseFromString(raw, "text/html");
    const source = doc.querySelector("iframe");
    if (!source) return null;

    const iframe = document.createElement("iframe");
    iframe.src = source.getAttribute("src") || "";
    iframe.title = source.getAttribute("title") || title || "F1 stream";
    iframe.allow = source.getAttribute("allow") ||
      "autoplay; fullscreen; picture-in-picture";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy =
      source.getAttribute("referrerpolicy") ||
      "strict-origin-when-cross-origin";

    return iframe.src ? iframe : null;
  }

  try {
    const url = new URL(raw, window.location.href);
    if (url.protocol !== "http:" && url.protocol !== "https:") return null;

    const iframe = document.createElement("iframe");
    iframe.src = url.href;
    iframe.title = title || "F1 stream";
    iframe.allow = "autoplay; fullscreen; picture-in-picture";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    return iframe;
  } catch {
    return null;
  }
}

function showPlayer(stream) {
  playerTitle.textContent = stream.name || "F1 stream";
  playerContainer.replaceChildren();

  const iframe = createEmbed(stream.iframe, stream.name || "F1 stream");

  if (!iframe) {
    const message = document.createElement("div");
    message.className = "player-message";

    const inner = document.createElement("div");
    inner.className = "player-message-inner";

    const title = document.createElement("strong");
    title.textContent = "Geen geldige embed beschikbaar";

    const text = document.createElement("div");
    text.textContent = "Deze stream heeft geen bruikbare iframe-URL aangeleverd.";

    inner.append(title, text);
    message.appendChild(inner);
    playerContainer.appendChild(message);
  } else {
    playerContainer.appendChild(iframe);
  }

  playerOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closePlayerWindow() {
  playerOverlay.classList.remove("open");
  document.body.style.overflow = "";
  playerContainer.replaceChildren();
}

function createCard(stream, live) {
  const card = document.createElement("article");
  card.className = "card";

  const poster = document.createElement("div");
  poster.className = "poster";

  if (stream.poster) {
    const img = document.createElement("img");
    img.src = stream.poster;
    img.alt = stream.name || "F1";
    img.loading = "lazy";

    img.onerror = () => {
      img.remove();
      const placeholder = document.createElement("div");
      placeholder.className = "poster-placeholder";
      placeholder.textContent = "F1";
      poster.appendChild(placeholder);
    };

    poster.appendChild(img);
  } else {
    const placeholder = document.createElement("div");
    placeholder.className = "poster-placeholder";
    placeholder.textContent = "F1";
    poster.appendChild(placeholder);
  }

  const badge = document.createElement("div");
  badge.className = "badge " + (live ? "badge-live" : "badge-upcoming");
  badge.textContent = live ? "Live" : "Upcoming";
  poster.appendChild(badge);

  const body = document.createElement("div");
  body.className = "card-body";

  const title = document.createElement("h3");
  title.className = "card-title";
  title.textContent = stream.name || "F1 stream";

  const time = document.createElement("div");
  time.className = "card-time";
  time.textContent = live ? "Nu live" : formatDate(stream.starts_at);

  const button = document.createElement("button");
  button.type = "button";
  button.className = "watch-btn" + (live ? " live" : "");
  button.textContent = live ? "Kijk live" : "Open stream";
  button.addEventListener("click", () => showPlayer(stream));

  body.append(title, time, button);
  card.append(poster, body);
  return card;
}

function showEmpty(container, text) {
  const empty = document.createElement("div");
  empty.className = "empty";
  empty.textContent = text;
  container.appendChild(empty);
}

function renderStreams(streams) {
  liveGrid.replaceChildren();
  upcomingGrid.replaceChildren();

  const f1 = streams.filter(isF1).filter(stream => !isPast(stream));

  const live = f1.filter(isLive).sort((a,b) =>
    new Date(a.starts_at || 0) - new Date(b.starts_at || 0)
  );

  const upcoming = f1.filter(isUpcoming).sort((a,b) =>
    new Date(a.starts_at || 0) - new Date(b.starts_at || 0)
  );

  liveCount.textContent = `${live.length} ${live.length === 1 ? "stream" : "streams"}`;
  upcomingCount.textContent = `${upcoming.length} ${upcoming.length === 1 ? "stream" : "streams"}`;

  if (!live.length) {
    showEmpty(liveGrid, "Er is momenteel geen F1-sessie live.");
  } else {
    live.forEach(stream => liveGrid.appendChild(createCard(stream, true)));
  }

  if (!upcoming.length) {
    showEmpty(upcomingGrid, "Geen aankomende F1-sessies gevonden.");
  } else {
    upcoming.forEach(stream => upcomingGrid.appendChild(createCard(stream, false)));
  }
}

async function loadStreams() {
  try {
    statusText.textContent = "Streams vernieuwen...";
    errorBox.style.display = "none";

    const response = await fetch(API_URL, {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) throw new Error(`API HTTP ${response.status}`);

    const data = await response.json();

    if (!data || data.success !== true) {
      throw new Error("API gaf geen succesvolle response.");
    }

    const categories = Array.isArray(data.streams) ? data.streams : [];
    const allStreams = [];

    for (const category of categories) {
      if (!category || !Array.isArray(category.streams)) continue;

      for (const stream of category.streams) {
        if (!stream) continue;

        allStreams.push({
          ...stream,
          category_name: stream.category_name || category.category || "",
          category: stream.category || category.category || ""
        });
      }
    }

    renderStreams(allStreams);
    statusText.textContent = "Verbonden";
  } catch (error) {
    console.error("F1 API fout:", error);
    statusText.textContent = "Verbindingsfout";
    errorBox.textContent = "Streams konden niet worden geladen: " + error.message;
    errorBox.style.display = "block";
  }
}

closePlayer.addEventListener("click", closePlayerWindow);

playerOverlay.addEventListener("click", event => {
  if (event.target === playerOverlay) closePlayerWindow();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closePlayerWindow();
});

loadStreams();
setInterval(loadStreams, REFRESH_INTERVAL);
</script>
</body>
</html>
